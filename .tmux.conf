# remap prefix from 'C-b' to 'M-q'/alt+q
unbind C-b
set-option -g prefix M-q
bind-key M-q send-prefix

# reload config file (bind-key + r)/alt+q + r
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded tmux config!"

# split panes in the same path
bind | split-window -h -c '#{pane_current_path}'  # Split panes horizontally
bind - split-window -v -c '#{pane_current_path}'  # Split panes vertically 
unbind '"' 
unbind % 

# create new window in the same path
bind c new-window -c "#{pane_current_path}" 

# equalize pane sizes
bind = select-layout even-horizontal
bind + select-layout even-vertical

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U 
bind -n M-j select-pane -D 
 
# Enable mouse mode (tmux 2.1 and above) 
set -g mouse on 
 
# Allows for faster key repetition 
set -sg escape-time 0

# increase scrollback buffer to 10000
set -g history-limit 10000

# Activity monitoring
setw -g monitor-activity off
set -g visual-activity off

# start window index at 1
set -g base-index 1

# start pane index at 1
set -g pane-base-index 1

# re-number windows when one is closed
set -g renumber-windows on

# set terminal color
# tmux-256color over screen-256color: screen's entry has no `sitm`, so italics
# are impossible there, and no Ss/Se either (see the cursor-shape note below).
# Needs the tmux-256color entry in the terminfo db (ncurses-term on Debian/
# Ubuntu). tmux itself starts fine without it -- it does NOT error out -- so the
# breakage is silent and lands on the programs inside panes, which inherit a TERM
# they can't look up and lose keys and color. Check `infocmp tmux-256color`
# before copying this line to another host.
set -g default-terminal "tmux-256color"

# Advertise 24-bit color. Neither screen-256color nor tmux-256color carries the
# RGB capability, so default-terminal alone leaves tmux quantizing truecolor to
# 256 -- this line is what actually turns it on. Matched against the OUTER TERM
# (xterm-256color under Alacritty), not default-terminal.
# `terminal-features` over the older `terminal-overrides ,*:Tc` hack: it's the
# supported form since tmux 3.2 and it composes with tmux's built-in feature
# table instead of hand-patching terminfo entries.
set -as terminal-features ",xterm-256color:RGB"

# Pass through DECSCUSR cursor-shape escapes (Ss/Se) to the outer terminal.
# Kept as a safety net, not a necessity: both the outer xterm-256color entry and
# tmux's built-in xterm* feature set (`cstyle`) already supply this, and
# tmux-256color carries Ss/Se too -- byte-identical to the values below. It only
# earns its keep on a host whose outer TERM lacks Ss, which screen-256color did.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# No Windows PATH injection here: a raw `default-command` string becomes the
# window's initial name verbatim with automatic-rename off below. Not needed
# anyway -- WSL interop already puts /mnt/c/... on PATH inside panes.

# Pin the pane shell: tmux snapshots $SHELL at SERVER start, so a server that
# predates `chsh` keeps spawning the old one. if-shell is sync (run-shell isn't)
# and probes both paths -- zsh is /usr/bin/zsh on Linux, /bin/zsh on macOS.
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh' \
                              'if-shell "[ -x /bin/zsh ]" "set -g default-shell /bin/zsh"'

# Keep window names static — default automatic-rename overwrites #W with
# whatever the active pane's foreground process is (bash, vim, ssh, ...) on
# every command change, which fights with manually chosen names.
set -g automatic-rename off

# Status bar clock — ISO-style timestamp instead of tmux's default
# "%H:%M %d-%b-%y".
set -g status-right '%Y-%m-%d %H:%M'

# Status bar at the top of the terminal instead of tmux's default bottom.
set -g status-position top

# Active pane styling
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39,bold'
# pane-border-indicators defaults to 'colour', which only tints HALF the
# shared border between exactly two panes (tmux(1), pane-border-indicators)
# -- that's the stray 1-line highlight instead of a full border. 'off'
# makes the active pane's whole border length use pane-active-border-style.
set -g pane-border-indicators off
set -g pane-border-lines heavy
#set -g window-style 'bg=colour235'
#set -g window-active-style 'bg=terminal'

# Active window styling (status bar) — the window list (`1:name*`) only
# marked the current window with a trailing `*`, easy to miss. Background
# color makes it legible at a glance. Green (colour28) instead of the
# colour39 pane-border blue — that combo didn't read well, and green also
# keeps active-window and active-pane cues visually distinct from each other.
set -g window-status-current-style 'bg=colour28,fg=colour255,bold'

# Drop the `*` flag on the active window now that color marks it — scoped to
# window-status-current-format only, so background windows keep #{window_flags}
# (activity `#`, bell `!`, zoomed `Z`, etc.) which are still useful there.
set -g window-status-current-format '#I:#W'

# Pane labels — set a custom indicator per pane (e.g. "claude-1", "claude-2")
# to tell parallel Claude sessions apart at a glance. Uses a pane-scoped user
# option (@label) instead of the built-in pane title: Claude Code (and most
# CLIs) set the terminal title via OSC escapes, which writes to that same
# pane_title slot and clobbers a manual label within moments — regardless of
# which pane is focused. @label is never touched by any program, so it sticks.
set -g pane-border-status top
set -g pane-border-format "#[fg=colour250]###{pane_index}#[default] #{?@label,#[fg=colour214]#[bold]#{@label},#[fg=colour238]unlabeled}"
bind-key T command-prompt -I "#{@label}" -p "Pane label:" "set -p @label '%%'"

# Shortcuts cheat sheet — popup card of custom binds, since the default
# `?` (list-keys -N) dumps the entire tmux keymap instead of just ours.
# Script loops on keypress and exits on Esc or q, closing the popup (-E).
# Fixed size (not %) sized to the content itself (38 lines, 47 cols max —
# "Paste buffer (from machine clipboard)" is the widest line) plus margin,
# so there's no blank space padding out the box on larger terminals.
bind-key ? display-popup -E -w 55 -h 40 "bash ~/.tmux/cheatsheet.sh"

# Enable vi-copy-mode -> have vi key bindings in copy-mode (prefix + [)
setw -g mode-keys vi 

# prefix+p / prefix+] paste the machine clipboard (whatever was last copied
# outside tmux, e.g. a browser), not just tmux's own copy-mode buffer. ] is
# tmux's stock paste key, so it gets the same bind -- otherwise muscle-memory
# prefix+] silently pastes the stale tmux buffer instead.
# The per-OS clipboard tooling (win32yank on WSL, pbcopy/pbpaste on macOS,
# wl-clipboard/xclip/xsel on Linux) lives in ~/.tmux/clip.sh, shared with
# .vimrc, rather than as an if-shell block per key here. Invoked via `bash`
# like cheatsheet.sh, so it doesn't depend on the exec bit surviving a clone.
unbind p
unbind ]
bind p run-shell 'bash ~/.tmux/clip.sh tmux-paste'
bind ] run-shell 'bash ~/.tmux/clip.sh tmux-paste'

# set keys for visual mode (v) and yank/copy (y) -- y also pushes the
# selection out to the OS clipboard
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel 'bash ~/.tmux/clip.sh copy'

# Per-machine overrides, untracked: anything one box needs that the others
# don't (a different prefix, extra binds, colors). Sourced last so it wins.
# -q: no error when the file doesn't exist, which is the common case.
source-file -q ~/.tmux.local.conf
