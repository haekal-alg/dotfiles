# remap prefix from 'C-b' to 'M-q'/alt+q
unbind C-b
set-option -g prefix M-q
bind-key M-q send-prefix

# reload config file (bind-key + r)/alt+q + r
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded tmux config!"

# split panes in the same path
bind | split-window -h -c '#{pane_current_path}'  # Split panes horizontally
bind - split-window -v -c '#{pane_current_path}'  # Split panes vertically 
unbind '"' 
unbind % 

# create new window in the same path
bind c new-window -c "#{pane_current_path}" 

# equalize pane sizes
bind = select-layout even-horizontal
bind + select-layout even-vertical

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U 
bind -n M-j select-pane -D 
 
# Enable mouse mode (tmux 2.1 and above) 
set -g mouse on 
 
# Allows for faster key repetition 
set -sg escape-time 0

# increase scrollback buffer to 10000
set -g history-limit 10000

# Activity monitoring
setw -g monitor-activity off
set -g visual-activity off

# start window index at 1
set -g base-index 1

# start pane index at 1
set -g pane-base-index 1

# re-number windows when one is closed
set -g renumber-windows on

# set terminal color
set -g default-terminal "screen-256color"

# Pass through DECSCUSR cursor-shape escapes (Ss/Se) to the outer terminal.
# screen-256color's terminfo has no Ss/Se entry, so without this tmux eats
# vim's t_SI/t_EI cursor-shape codes instead of forwarding them.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Windows PATH injection for tmux child shells moved to ~/.bashrc: a raw
# `default-command` shell string (e.g. 'PATH="..." exec bash') becomes the
# window's initial name verbatim once automatic-rename is off below, since
# there's no later process-based rename to overwrite it with "bash".

# Keep window names static — default automatic-rename overwrites #W with
# whatever the active pane's foreground process is (bash, vim, ssh, ...) on
# every command change, which fights with manually chosen names.
set -g automatic-rename off

# Status bar clock — ISO-style timestamp instead of tmux's default
# "%H:%M %d-%b-%y".
set -g status-right '%Y-%m-%d %H:%M:%S'

# Active pane styling
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39,bold'
# pane-border-indicators defaults to 'colour', which only tints HALF the
# shared border between exactly two panes (tmux(1), pane-border-indicators)
# -- that's the stray 1-line highlight instead of a full border. 'off'
# makes the active pane's whole border length use pane-active-border-style.
set -g pane-border-indicators off
set -g pane-border-lines heavy
set -g window-style 'bg=colour235'
set -g window-active-style 'bg=terminal'

# Pane labels — set a custom indicator per pane (e.g. "claude-1", "claude-2")
# to tell parallel Claude sessions apart at a glance. Uses a pane-scoped user
# option (@label) instead of the built-in pane title: Claude Code (and most
# CLIs) set the terminal title via OSC escapes, which writes to that same
# pane_title slot and clobbers a manual label within moments — regardless of
# which pane is focused. @label is never touched by any program, so it sticks.
set -g pane-border-status top
set -g pane-border-format "#[fg=colour250]###{pane_index}#[default] #{?@label,#[fg=colour214]#[bold]#{@label},#[fg=colour238]unlabeled}"
bind-key T command-prompt -I "#{@label}" -p "Pane label:" "set -p @label '%%'"

# Shortcuts cheat sheet — popup card of custom binds, since the default
# `?` (list-keys -N) dumps the entire tmux keymap instead of just ours.
# Script loops on keypress and exits on Esc or q, closing the popup (-E).
# Fixed size (not %) sized to the content itself (38 lines, 47 cols max —
# "Paste buffer (from machine clipboard)" is the widest line) plus margin,
# so there's no blank space padding out the box on larger terminals.
bind-key ? display-popup -E -w 55 -h 40 "bash ~/.tmux/cheatsheet.sh"

# Enable vi-copy-mode -> have vi key bindings in copy-mode (prefix + [)
setw -g mode-keys vi 

# unbind p and set it to paste — pull from the machine clipboard first
# (WSL: win32yank, mac: pbpaste) so prefix+p pastes whatever was last
# copied outside tmux (e.g. a browser), not just tmux's own copy-mode buffer.
# NOTE: absolute paths throughout.
# - run-shell executes with the tmux server's captured PATH, not the
#   interactive shell's, so it doesn't pick up ~/.local/bin, and bare
#   `tmux` resolves to a second, older /usr/bin/tmux ahead of the
#   custom-built one that's actually running the server.
# - win32yank.exe must live on the NTFS-backed /mnt/c filesystem, not the
#   WSL/ext4 side (~/.local/bin) — launched via WSL interop from an ext4
#   path it fails clipboard access with OS error 5 (no window-station
#   attachment); from /mnt/c it's reliable.
# - path is resolved with a glob at bind-time instead of a hardcoded
#   /mnt/c/Users/<name>/... — keeps the Windows account name out of this
#   file and means the binding works unmodified on any machine.
unbind p
if-shell "uname -r | grep -qi microsoft" \
  "bind p run-shell 'w=\$(ls /mnt/c/Users/*/.local/bin/win32yank.exe 2>/dev/null | head -1); \"\$w\" -o --lf | ~/.local/bin/tmux load-buffer - && ~/.local/bin/tmux paste-buffer'" \
  "bind p run-shell 'pbpaste | tmux load-buffer - && tmux paste-buffer'"

# same fix for ] — it's tmux's stock paste-buffer key, left alone above,
# so muscle-memory prefix+] silently pasted tmux's own buffer instead of
# the machine clipboard. Mirror the p bind so both keys behave the same.
unbind ]
if-shell "uname -r | grep -qi microsoft" \
  "bind ] run-shell 'w=\$(ls /mnt/c/Users/*/.local/bin/win32yank.exe 2>/dev/null | head -1); \"\$w\" -o --lf | ~/.local/bin/tmux load-buffer - && ~/.local/bin/tmux paste-buffer'" \
  "bind ] run-shell 'pbpaste | tmux load-buffer - && tmux paste-buffer'"

# set keys for visual mode (v) and yank/copy (y)
 bind-key -Tcopy-mode-vi 'v' send -X begin-selection
 if-shell "uname -r | grep -qi microsoft" \
   "bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel 'clip.exe'" \
   "bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'"
